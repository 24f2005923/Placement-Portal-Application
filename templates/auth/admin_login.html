<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .admin-icon {
            width: 60px;
            height: 60px;
            background: #2c3e50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }

        .btn-admin {
            background: #2c3e50;
            color: white;
            border: none;
        }

        .btn-admin:hover {
            background: #1a252f;
            color: white;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="text-center">
            <div class="admin-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h3 class="fw-bold">Admin Portal</h3>
            <p class="text-muted small">Secure login for administrators</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="text" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-admin w-100 py-2">Login to Admin Dashboard</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('main.index') }}" class="text-muted small text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i> Return Home
            </a>
        </div>
    </div>
</body>

</html>
