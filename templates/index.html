{% extends 'base.html' %}

{% block title %}Welcome | Placement Hub{% endblock %}

{% block extra_css %}
<style>
    body,
    html {
        height: 100%;
        margin: 0;
    }

    .hero-bg {
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url("{{ url_for('static', filename='images/hero_bg.jpg') }}");
        height: 100vh;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        margin-top: -80px;
        /* Offset for sticky navbar height if needed */
    }

    .catchy-text {
        font-size: 4rem;
        font-weight: 800;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        animation: fadeInDown 1.5s ease-out;
    }

    .sub-catchy {
        font-size: 1.5rem;
        font-weight: 300;
        opacity: 0.9;
        margin-top: 1rem;
        animation: fadeInUp 2s ease-out;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="hero-bg">
    <div class="container text-center">
        <h1 class="catchy-text">Shaping Futures,<br><span style="color: #a855f7;">Connecting Excellence</span></h1>
        <p class="sub-catchy">Your one-stop destination for career opportunities and professional growth.</p>
    </div>
</div>
{% endblock %}
