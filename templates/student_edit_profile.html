{% extends 'base_student.html' %}

{% block title %}Edit Profile{% endblock %}
{% block page_title %}Update Information{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card p-4">
            <form>
                <h5 class="fw-bold mb-4 text-primary">Personal & Academic Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control rounded-3" value="Alex Johnson">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Current CGPA</label>
                        <input type="number" step="0.01" class="form-control rounded-3" value="8.90">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Skills (Comma separated)</label>
                        <input type="text" class="form-control rounded-3" value="Python, Flask, Web Development, SQL">
                    </div>

                    <h5 class="fw-bold mt-5 mb-4 text-primary">Resume Upload</h5>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Upload New Resume (PDF Only)</label>
                        <div class="input-group">
                            <input type="file" class="form-control rounded-3">
                        </div>
                        <p class="text-muted small mt-2">Current Resume: <span
                                class="text-primary">alex_johnson_cv.pdf</span></p>
                    </div>

                    <div class="col-12 mt-5 text-end">
                        <button type="submit" class="btn btn-primary-custom rounded-pill px-5">Save Profile</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
