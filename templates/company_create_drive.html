{% extends 'base_company.html' %}

{% block title %}Create Drive{% endblock %}
{% block page_title %}Post Placement Drive{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card p-4">
            <div class="text-center mb-5">
                <div class="bg-primary-subtle d-inline-block p-3 rounded-4 mb-3">
                    <i class="fas fa-bullhorn text-primary fs-3"></i>
                </div>
                <h4 class="fw-bold">New Placement Opportunity</h4>
                <p class="text-muted">Fill in the details to announce a new recruitment drive to students</p>
            </div>

            <form>
                <div class="row g-4">
                    <div class="col-md-12">
                        <label class="form-label fw-bold small text-muted">Drive Title</label>
                        <input type="text" class="form-control rounded-3 py-3 px-4"
                            placeholder="e.g. Graduate Engineer Trainee 2024">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Job Role</label>
                        <input type="text" class="form-control rounded-3 py-3 px-4"
                            placeholder="e.g. Software Developer">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Drive Date</label>
                        <input type="date" class="form-control rounded-3 py-3 px-4">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted">Salary Package (LPA)</label>
                        <input type="text" class="form-control rounded-3 py-3 px-4" placeholder="e.g. 8.5 LPA">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted">Eligibility CGPA</label>
                        <input type="number" step="0.1" class="form-control rounded-3 py-3 px-4" placeholder="e.g. 7.5">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted">Application Deadline</label>
                        <input type="date" class="form-control rounded-3 py-3 px-4">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-muted">Job Description & Requirements</label>
                        <textarea class="form-control rounded-4 px-4 py-3" rows="6"
                            placeholder="Describe the role, responsibilities, and required skills..."></textarea>
                    </div>

                    <div class="col-12 mt-5">
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 rounded-4 fw-bold fs-5">Publish
                            Application Drive</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .bg-primary-subtle {
        background-color: #e0e7ff;
    }
</style>
{% endblock %}
