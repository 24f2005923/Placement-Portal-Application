{% extends 'base_student.html' %}

{% block title %}Notifications{% endblock %}
{% block page_title %}Recent Activity{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">System Notifications</h5>
            <button class="btn btn-sm btn-light rounded-pill">Mark all as read</button>
        </div>

        <div class="card p-5 text-center shadow-sm">
            <div class="mb-3">
                <i class="fas fa-bell-slash text-muted fs-1"></i>
            </div>
            <h5 class="text-muted">No New Notifications</h5>
            <p class="text-muted small">We'll notify you here about updates to your applications and upcoming drives.
            </p>
        </div>
    </div>
</div>

<style>
    .bg-primary-subtle {
        background-color: #eef2ff;
    }

    .bg-success-subtle {
        background-color: #f0fdf4;
    }
</style>
{% endblock %}
